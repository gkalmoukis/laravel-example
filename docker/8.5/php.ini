[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
pcov.directory = .

; Execute assert() statements in local development and tests. PHP's default of -1
; compiles them out entirely, which both hides contract violations and leaves the
; assert lines uncovered, breaking the 100% coverage gate (QA-01). CI sets the same
; value. Production keeps PHP's default, so assertions cost nothing there.
zend.assertions = 1
